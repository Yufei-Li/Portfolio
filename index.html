<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yufei Li</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---- shared tokens (identical block in yale-accounting-course.html) ---- */
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --grey: #737373;
    --grey-line: #c4c4c4;
    --grey-dim: #a3a3a3;
    --rule: #e5e5e5;
    --panel: #f5f5f5;
    --tennis: #d7e34b;
    --seam: #ffffff;

    --mark-size: clamp(23px, 2.6vh, 28px);
    --fs-h1: clamp(15px, 1.7vh, 18px);
    --fs-heading: clamp(15px, 1.7vh, 18px);
    --fs-body: clamp(15px, 1.7vh, 18px);
    --fs-small: clamp(13px, 1.5vh, 15px);
    --fs-footer: clamp(14px, 1.6vh, 16px);

    --sp-mark: clamp(16px, 3.4vh, 44px);
    --sp-intro: clamp(22px, 4.6vh, 56px);
    --sp-section: clamp(20px, 4.2vh, 50px);
    --sp-label: clamp(10px, 2vh, 18px);
    --sp-para: clamp(6px, 1.2vh, 12px);
    --sp-list: clamp(7px, 1.4vh, 12px);

    --sp-top: clamp(24px, 6vh, 64px);
    --gutter: clamp(24px, 8vw, 120px);
    --measure: 470px;
  }

  html[data-theme="dark"] {
    --bg: #171717;
    --ink: #ffffff;
    --grey: #8f8f8f;
    --grey-line: #5a5a5a;
    --grey-dim: #616161;
    --rule: #2e2e2e;
    --panel: #212121;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { color-scheme: light dark; }

  body {
    margin: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 400;
    transition: background 0.3s ease, color 0.3s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    body, a { transition: none !important; }
    .enter .content > *,
    .enter footer {
      animation: none !important;
      opacity: 1;
      transform: none;
    }
  }

  /* ---- entrance: everything rises into place on arrival ---- */
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .enter .content > *,
  .enter footer {
    animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .enter .content > *:nth-child(1) { animation-delay: 0s; }
  .enter .content > *:nth-child(2) { animation-delay: 0.06s; }
  .enter .content > *:nth-child(3) { animation-delay: 0.12s; }
  .enter .content > *:nth-child(4) { animation-delay: 0.18s; }
  .enter .content > *:nth-child(5) { animation-delay: 0.24s; }
  .enter .content > *:nth-child(6) { animation-delay: 0.30s; }
  .enter .content > *:nth-child(7) { animation-delay: 0.36s; }
  .enter .content > *:nth-child(8) { animation-delay: 0.42s; }
  .enter footer { animation-delay: 0.46s; }

  .page {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--sp-top) var(--gutter) 0;
    min-height: 0;
  }

  .content {
    max-width: 560px;
    width: 100%;
  }

  .mark {
    display: block;
    width: var(--mark-size);
    height: var(--mark-size);
    margin-bottom: var(--sp-mark);
  }

  header.intro { margin-bottom: var(--sp-intro); }

  h1 {
    font-size: var(--fs-h1);
    font-weight: 400;
    letter-spacing: -0.005em;
    margin: 0;
    color: var(--ink);
  }

  section { margin-bottom: var(--sp-section); }
  section:last-of-type { margin-bottom: 0; }

  .label {
    font-size: var(--fs-heading);
    font-weight: 400;
    color: var(--ink);
    margin: 0 0 var(--sp-label);
    letter-spacing: -0.005em;
  }

  .about p:not(.label) {
    font-size: var(--fs-body);
    line-height: 1.6;
    color: var(--grey);
    margin: 0 0 var(--sp-para);
    max-width: var(--measure);
  }

  .about p:last-child { margin-bottom: 0; }

  a { color: inherit; }

  .link-list {
    display: flex;
    flex-direction: column;
    gap: var(--sp-list);
  }

  a.link {
    font-size: var(--fs-body);
    color: var(--grey);
    font-weight: 400;
    width: fit-content;
    text-decoration: underline;
    text-decoration-color: var(--grey-line);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color 0.15s ease, text-decoration-color 0.15s ease;
  }

  a.link:hover,
  a.link:focus-visible {
    color: var(--ink);
    text-decoration-color: var(--grey);
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--grey);
    outline-offset: 3px;
    border-radius: 2px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px var(--gutter) 24px;
    font-size: var(--fs-footer);
  }

  .copyright { color: var(--grey-dim); }

  .theme-toggle { display: flex; gap: 16px; }

  .theme-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: inherit;
    font-weight: 400;
    cursor: pointer;
    color: var(--grey-dim);
    transition: color 0.15s ease;
  }

  .theme-btn[aria-pressed="true"] { color: var(--ink); }

  @media (max-width: 480px) {
    .page { padding: var(--sp-top) clamp(20px, 8vw, 40px) 0; }
    footer { padding: 14px clamp(20px, 8vw, 40px) 20px; }
  }
</style>
</head>
<body class="enter">
  <div class="page">
    <div class="content">
      <svg class="mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="var(--tennis)"/>
        <g fill="none" stroke="var(--seam)" stroke-width="2" stroke-linecap="round">
          <path d="M6 7c8 7 8 19 0 26"/>
          <path d="M34 7c-8 7-8 19 0 26"/>
        </g>
      </svg>

      <header class="intro">
        <h1>Yufei Li</h1>
      </header>

      <section class="about">
        <p class="label">About</p>
        <p>Design learning experiences that prepare minds for what comes next.</p>
      </section>

      <section>
        <p class="label">Teaching Projects</p>
        <div class="link-list">
          <a class="link" href="#">X Academy</a>
        </div>
      </section>

      <section>
        <p class="label">Educational Technology Projects</p>
        <div class="link-list">
          <a class="link" href="yale-accounting-course.html">Yale Accounting Pre-work Course</a>
          <a class="link" href="#">STEM Edtech in Africa</a>
        </div>
      </section>

      <section>
        <p class="label">More &amp; Connect</p>
        <div class="link-list">
          <a class="link" href="#">Resume</a>
          <a class="link" href="mailto:you@example.com">Email</a>
        </div>
      </section>
    </div>
  </div>

  <footer>
    <span class="copyright">© 2026</span>
    <div class="theme-toggle">
      <button class="theme-btn" id="btn-light" aria-pressed="true">Light</button>
      <button class="theme-btn" id="btn-dark" aria-pressed="false">Dark</button>
    </div>
  </footer>

  <script>
    /* a bfcache restore does not re-run animations, so replay them by hand */
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      const body = document.body;
      body.classList.remove('enter');
      void body.offsetWidth; /* force a reflow so the class re-application restarts it */
      body.classList.add('enter');
    });

    const root = document.documentElement;
    const btnLight = document.getElementById('btn-light');
    const btnDark = document.getElementById('btn-dark');

    function setTheme(theme) {
      root.setAttribute('data-theme', theme);
      btnLight.setAttribute('aria-pressed', theme === 'light');
      btnDark.setAttribute('aria-pressed', theme === 'dark');
    }

    btnLight.addEventListener('click', () => setTheme('light'));
    btnDark.addEventListener('click', () => setTheme('dark'));

    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    }
  </script>
</body>
</html>
